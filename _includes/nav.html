<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.menus -%}
        {%- if item.needs_posts and site.posts.size == 0 -%}{%- continue -%}{%- endif -%}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
