<footer class="site-footer">
  <div class="wrap site-footer-inner">
    <span>&copy; {{ site.time | date: "%Y" }} {{ site.author.name | escape }}</span>
    <span class="site-footer-links">
      <a href="https://github.com/{{ site.author.github }}" rel="me noopener">GitHub</a>
      {%- if site.posts.size > 0 %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      {%- endif %}
    </span>
  </div>
</footer>
