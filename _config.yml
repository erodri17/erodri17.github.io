# Site settings
# Restart `jekyll serve` after changing this file.

title: Elmer Rodriguez
description: >-
  Elmer Rodriguez. Operations automation, PowerShell tooling and
  clear process documentation.
lang: en-US
timezone: America/New_York
url: "https://erodri17.github.io"
baseurl: ""
permalink: /:title/
image: /assets/img/elmeravatar397.jpeg # used when the site is shared

# Profile shown at the top of the home page
author:
  name: Elmer Rodriguez
  headline: Operations automation and PowerShell tooling
  github: erodri17
  avatar: /assets/img/elmeravatar397.jpeg

# Number of posts listed on the home page
number_of_posts: 5

markdown: kramdown
highlighter: rouge

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
